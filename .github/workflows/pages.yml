name: Showcase Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf poppler-utils
      - run: npm ci --ignore-scripts
      - run: npm run format:check && npm run lint
      - name: Build core, optional layout/tables and the showcase
        run: npm run build:showcase
        env:
          SHOWCASE_BASE: /updf/
      - run: npm run test:showcase
        env:
          SHOWCASE_CHROMIUM: /usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
